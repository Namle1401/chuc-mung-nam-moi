<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chúc mừng năm mới</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff0000, #ffcc00);
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 48px;
            animation: zoom 1.5s infinite alternate;
        }
        @keyframes zoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <h1>🎉 Chúc mừng năm mới 🎉</h1>
</body>
</html>
